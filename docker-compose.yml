version: "3.8"

# ============================================================
# TurSathi AI — Cloud Production Docker Compose Configuration
# Orchestrates FastAPI Backend + PostgreSQL Database
# ============================================================

services:
  # ── PostgreSQL Database Service ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tursathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-tursathi_db}
    volumes:
      - tursathi_pgdata:/var/lib/postgresql/data
    # Bind strictly to localhost so PostgreSQL is never exposed to public internet scanners
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tursathi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - tursathi_net

  # ── TurSathi AI FastAPI Backend Service ──────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tursathi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-2}
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Error: Set POSTGRES_PASSWORD in .env}"
      - POSTGRES_DB=${POSTGRES_DB:-tursathi_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tursathi_db}
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tursathi_db}
      - "SECRET_KEY=${SECRET_KEY:?Error: Set a strong SECRET_KEY in .env}"
      - API_KEY=${API_KEY:-}
      - FRONTEND_CORS_ORIGINS=${FRONTEND_CORS_ORIGINS:-http://localhost:8081,http://localhost:8000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_STT_MODEL=${SARVAM_STT_MODEL:-saaras:v4}
      - ENABLE_TEST_ENDPOINTS=${ENABLE_TEST_ENDPOINTS:-False}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-TurSathi AI}
      - SMTP_TLS=${SMTP_TLS:-True}
    volumes:
      - tursathi_uploads:/app/backend/uploads
    ports:
      - "${PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 3000M
        reservations:
          memory: 800M
    networks:
      - tursathi_net

# ── Persistent Storage Volumes ─────────────────────────────
volumes:
  tursathi_pgdata:
    name: tursathi_pgdata
  tursathi_uploads:
    name: tursathi_uploads

# ── Isolated Application Network ───────────────────────────
networks:
  tursathi_net:
    name: tursathi_net
