version: "3.8"

# ============================================================
# TurSathi AI — Cloud Production Docker Compose Configuration
# Orchestrates FastAPI Backend + PostgreSQL Database
# ============================================================

services:
  # ── PostgreSQL Database Service ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tursathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TurSathi@2026DB}
      POSTGRES_DB: ${POSTGRES_DB:-tursathi_db}
    volumes:
      - tursathi_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tursathi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tursathi_net

  # ── TurSathi AI FastAPI Backend Service ──────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tursathi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-TurSathi@2026DB}
      - POSTGRES_DB=${POSTGRES_DB:-tursathi_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-TurSathi@2026DB}@db:5432/${POSTGRES_DB:-tursathi_db}
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-TurSathi@2026DB}@db:5432/${POSTGRES_DB:-tursathi_db}
      - SECRET_KEY=${SECRET_KEY:-tursathi_ai_super_secret_jwt_key_2026_production_ready}
      - FRONTEND_CORS_ORIGINS=*
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
    volumes:
      - tursathi_uploads:/app/backend/uploads
    ports:
      - "8000:8000"
    networks:
      - tursathi_net

# ── Persistent Storage Volumes ─────────────────────────────
volumes:
  tursathi_pgdata:
    name: tursathi_pgdata
  tursathi_uploads:
    name: tursathi_uploads

# ── Isolated Application Network ───────────────────────────
networks:
  tursathi_net:
    name: tursathi_net
